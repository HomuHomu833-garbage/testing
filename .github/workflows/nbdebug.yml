name: Debug x86 NetBSD make
on:
  workflow_dispatch:
    inputs:
      version:
        description: "NDK version"
        required: false
        default: "r30"
        type: string

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cross-platform-actions/action@v1.7.0
        with:
          operating_system: netbsd
          architecture: x86-64
          version: "11.0"
          memory: 4G
          cpu_count: 4
      - name: Trace and backtrace in the VM
        shell: cpa.sh {0}
        run: |
          set +e; export T=x86-bsd
          sh ./scripts/bsd-setup.sh >/dev/null 2>&1
          sudo pkgin -y install gdb >/dev/null 2>&1
          export PATH="$HOME/gnubin:$PATH"
          V='${{ inputs.version }}'; d=$HOME/nb; mkdir -p $d; cd $d
          curl -fsSL "https://github.com/HomuHomu833/android-ndk-custom/releases/download/$(echo $V | grep -oE "^r[0-9]+")/android-ndk-$V-x86-netbsd-none.tar.xz" | tar -xJf -
          n=$(dirname "$(find $d -maxdepth 2 -name source.properties)"); m=$(find $n/prebuilt -name make -path '*/bin/*' | head -1)
          file $m; uname -a
          printf 'a:\n\t@echo A\nb:\n\t@echo B\nall: a b\n' > Makefile
          echo "== gdb -O -j2"
          gdb -batch -ex 'set follow-fork-mode parent' -ex run -ex 'bt 30' -ex 'info registers' -ex 'x/8i $pc' --args $m -O -j2 all 2>&1 | tail -60
          echo "== ktrace -O -j2"; ktrace -i -f $d/kt $m -O -j2 all >/dev/null 2>&1
          kdump -f $d/kt | grep -B40 -m1 PSIG | tail -45
