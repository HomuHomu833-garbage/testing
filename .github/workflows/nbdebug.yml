name: Debug x86 NetBSD make
on:
  workflow_dispatch:
    inputs:
      version:
        description: "NDK version"
        required: false
        default: "r30"
        type: string

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cross-platform-actions/action@v1.7.0
        with:
          operating_system: netbsd
          architecture: x86-64
          version: "11.0"
          memory: 4G
          cpu_count: 4
      - name: Trace and backtrace in the VM
        shell: cpa.sh {0}
        run: |
          set +e; export T=x86-bsd
          sh ./scripts/bsd-setup.sh >/dev/null 2>&1
          sudo pkgin -y install gdb >/dev/null 2>&1
          export PATH="$HOME/gnubin:$PATH"
          V='${{ inputs.version }}'; d=$HOME/nb; mkdir -p $d; cd $d
          curl -fsSL "https://github.com/HomuHomu833/android-ndk-custom/releases/download/${V%%[a-z-]*}/android-ndk-$V-x86-netbsd-none.tar.xz" | tar -xJf -
          n=$(dirname "$(find $d -maxdepth 2 -name source.properties)"); m=$(find $n/prebuilt -name make -path '*/bin/*' | head -1)
          file $m; uname -a
          printf 'a:\n\t@echo A\nb:\n\t@echo B\nall: a b\n' > Makefile
          for o in "" -O -Otarget -Oline "-O -j2" -j2; do echo "== make $o"; $m $o all; echo rc=$?; done
          echo "== ktrace -O"; ktrace -i -f $d/kt $m -O all >/dev/null 2>&1
          n2=$(kdump -f $d/kt | grep -n 'PSIG' | head -1 | cut -d: -f1); [ -n "$n2" ] && kdump -f $d/kt | sed -n "$((n2-40)),$((n2+3))p"
          echo "== gdb -O"
          gdb -batch -ex run -ex bt -ex 'info registers' -ex 'x/8i $pc' --args $m -O all 2>&1 | tail -40
